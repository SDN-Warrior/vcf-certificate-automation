---
certificate:
  name: vcf09-nsxa
  enabled: true

  common_name: vcf09-nsxa.lab.box

  subject:
    country: DE
    state: RLP
    locality: NW
    organization: SDN-Warrior
    organizational_unit: SDN-Warrior

  sans:
    - vcf09-nsxa.lab.box

  ip_sans: []

  key:
    type: rsa
    size: 4096

  acme:
    server: https://acme.home.lab/
    profile: vcf

  challenge:
    type: dns-01
    provider: windows_dns
    dns_server: dc1.home.lab
    dns_zone: lab.box
    ttl: 30

    validation_resolvers:
      - 192.168.11.2
      - 192.168.100.254

  deployment:
    type: vcf_operations
    ops_endpoint: vcf09-ops.lab.box
    appliance: NSXT_MANAGER
    target: vcf09-nsxa.lab.box
    validate_certs: false

  renewal:
    renew_before_days: 30
