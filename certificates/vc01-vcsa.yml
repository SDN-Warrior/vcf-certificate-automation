---
certificate:
  name: vc01-vcsa
  enabled: true

  common_name: vc01.vcf.sdn-warrior.cloud

  subject:
    country: DE
    state: RLP
    locality: NW
    organization: SDN-Warrior
    organizational_unit: SDN-Warrior

  sans:
    - vc01.vcf.sdn-warrior.cloud

  ip_sans: []

  key:
    type: rsa
    size: 4096

  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    issuance_timeout: 300

  challenge:
    type: dns-01
    provider: cloudflare

    credentials_file: /etc/letsencrypt/cloudflare/sdn-warrior-cloud.ini
    propagation_seconds: 30

  deployment:
    type: vcf_operations

    ops_endpoint: ops01.vcf.sdn-warrior.cloud

    appliance: VCENTER
    target: vc01.vcf.sdn-warrior.cloud

    validate_certs: false

    root_ca_file: /etc/ssl/certs/ISRG_Root_X1.pem

  renewal:
    renew_before_days: 30
